<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EFT Wiki Changes — activity monitor</title>
  <meta name="description" content="Real-time activity monitor for the ten language editions of the Escape from Tarkov Fandom wiki." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0c'/%3E%3Crect x='7' y='7' width='18' height='18' fill='%23ff9e1b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css?v=3" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">▮</span>
      <h1>EFT-WIKI<span>/</span>CHANGES</h1>
      <span class="ver">v1.2.0</span>
    </div>
    <div class="status">
      <button id="searchBtn" class="search-trigger" type="button" aria-label="Search changes (Ctrl+K)">
        <span class="st-icon">⌕</span><span class="st-label">SEARCH</span><kbd>CTRL K</kbd>
      </button>
      <span id="liveText" class="live offline">OFFLINE</span>
      <span id="lastUpdate" class="utc"></span>
    </div>
  </header>

  <nav id="tabs" class="tabs" aria-label="Wiki language editions"></nav>

  <main>
    <section class="controls">
      <div id="langMeta" class="meta"></div>
      <div id="legend" class="legend"></div>
    </section>

    <section id="days" class="days">
      <div class="placeholder">LOADING…</div>
    </section>
  </main>

  <footer class="statusbar">
    <span class="fleft">EFT-WIKI//CHANGES <b>v1.2.0</b></span>
    <span id="footLang" class="fmid"></span>
    <span class="fright">LOCAL JSON STORE · UTC</span>
  </footer>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <header class="modal-head">
        <div>
          <h2 id="modalTitle"></h2>
          <div id="modalSub" class="muted"></div>
        </div>
        <div class="modal-actions">
          <a id="downloadBtn" class="btn" download>⇩ day.json</a>
          <button id="closeBtn" class="btn ghost" aria-label="Close">✕</button>
        </div>
      </header>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="searchModal" class="cmdk hidden" role="dialog" aria-modal="true" aria-label="Search changes">
    <div class="cmdk-card">
      <div class="cmdk-bar">
        <span class="cmdk-icon" aria-hidden="true">⌕</span>
        <input id="searchInput" type="text" autocomplete="off" spellcheck="false"
          placeholder="Search pages, authors, comments…"
          aria-label="Search changes" role="combobox"
          aria-controls="searchResults" aria-expanded="false" aria-activedescendant="" />
        <button id="searchClear" class="cmdk-x hidden" type="button" aria-label="Clear search">✕</button>
        <div class="cmdk-scope" role="group" aria-label="Search scope">
          <button id="scopeLang" type="button" class="is-active" aria-pressed="true">EN</button><button id="scopeAll" type="button" aria-pressed="false">ALL</button>
        </div>
        <button id="searchClose" class="btn ghost" type="button" aria-label="Close search">✕</button>
      </div>
      <div id="searchMeta" class="cmdk-meta" aria-live="polite">Type at least 2 characters to search.</div>
      <div id="searchResults" class="cmdk-results" role="listbox" aria-label="Search results"></div>
      <footer class="cmdk-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> open day</span>
        <span><kbd>ESC</kbd> close</span>
        <span id="searchStat" class="cmdk-stat"></span>
      </footer>
    </div>
  </div>

  <script src="/app.js?v=3"></script>
</body>
</html>
